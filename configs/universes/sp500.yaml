universe: SP500
region: us
provider_uri: /data/dev
benchmark: "^GSPC"

instruments_train:    sp500_full
instruments_backtest: SP500

# No VWAP for S&P 500 (CRSP does not provide it)
label: "Ref($close, -2) / Ref($close, -1) - 1"

segments:
  train: ["2016-01-01", "2020-12-31"]
  valid: ["2021-01-01", "2022-12-31"]
  test:  ["2023-01-01", "2025-12-31"]

portfolio:
  topk: 50
  n_drop: 5
  account: 100000000
  open_cost: 0.0005
  close_cost: 0.0015
  limit_threshold: null   # no daily price limit for US equities
  deal_price: open
  min_cost: 0
